<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Private wedding team summary.">
  <meta name="theme-color" content="#3d1534">
  <title>Team summary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/team.css?v=6">
</head>
<body class="admin">
  <header class="team-top">
    <div class="admin-top">
      <div>
        <p class="team-kicker">Gloria &amp; Shannon <span aria-hidden="true">·</span> 19 Dec 2026</p>
        <h1 class="team-hello">Team summary</h1>
        <p id="updated" class="team-countdown"></p>
      </div>
      <div id="tools" class="admin-actions" hidden>
        <button type="button" id="refresh">Refresh</button>
        <button type="button" id="signout">Sign out</button>
      </div>
    </div>
  </header>

  <main id="gate" class="admin-gate">
    <p class="team-kicker">Private</p>
    <h1>Team summary</h1>
    <p>Statuses and notes from everyone. The password stays in this tab only.</p>
    <form id="lock" method="post" action="admin.html">
      <label class="admin-field">Password
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="admin-submit" type="submit">Open</button>
      <p id="gate-msg" class="admin-msg" aria-live="polite"></p>
    </form>
  </main>

  <main id="dash" class="admin-main" hidden>
    <div id="stats" class="admin-stats"></div>

    <section class="admin-section">
      <div class="admin-section-head">
        <h2>By person</h2>
        <p class="admin-legend"><span class="is-done">Done</span><span class="is-progress">In progress</span></p>
      </div>
      <ul id="people" class="admin-card admin-people"></ul>
    </section>

    <section class="admin-section">
      <div class="admin-section-head">
        <h2>Latest notes</h2>
      </div>
      <div id="latest"></div>
    </section>

    <section id="tasks-section" class="admin-section">
      <div class="admin-section-head">
        <h2 id="tasks-title">Tasks</h2>
        <button type="button" id="download" class="admin-link">Download CSV</button>
      </div>
      <div class="admin-filters" role="group" aria-label="Filter tasks">
        <select id="filter-person" class="admin-select" aria-label="Person"></select>
        <select id="filter-status" class="admin-select" aria-label="Status">
          <option value="">Any status</option>
          <option>Not started</option>
          <option>In progress</option>
          <option>Done</option>
        </select>
        <span class="admin-filter-sep" aria-hidden="true"></span>
        <button type="button" id="filter-critical" class="team-filter is-critical" aria-pressed="false"></button>
        <button type="button" id="filter-overdue" class="team-filter" aria-pressed="false">Overdue</button>
      </div>
      <div id="tasks" class="admin-tasks"></div>
    </section>

    <details id="removed-section" class="admin-section admin-removed" hidden>
      <summary></summary>
      <div id="removed" class="admin-tasks"></div>
    </details>
  </main>

  <script>
    const WORKER_URL = 'https://team-api.shannonpereira601.workers.dev';
    const KEY = 'weddingAdminPassword';
    const STATUSES = ['Not started', 'In progress', 'Done'];
    const FEED_LIMIT = 5;

    const ICONS = {
      critical: '<path d="M12 2.8 21.2 12 12 21.2 2.8 12Z" fill="currentColor" stroke="none"/><path d="M12 7.6v5.3" style="stroke:var(--crit-ink,#fff)" stroke-width="2.2"/><circle cx="12" cy="16.3" r="1.3" style="fill:var(--crit-ink,#fff)" stroke="none"/>',
      chevron: '<path d="m7 10 5 5 5-5"/>',
      todo: '<circle cx="12" cy="12" r="8.5"/>',
      progress: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/>',
      done: '<circle cx="12" cy="12" r="9.5" fill="currentColor" stroke="none"/><path d="m7.8 12.4 2.8 2.8 5.6-5.8" style="stroke:#fff" stroke-width="2.2"/>',
      note: '<path d="M5 5.5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7.5L7 20v-3.5H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/>',
      link: '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/>',
    };

    const gate = document.getElementById('gate');
    const dash = document.getElementById('dash');
    const tools = document.getElementById('tools');
    const form = document.getElementById('lock');
    const passwordInput = document.getElementById('password');
    const gateMsg = document.getElementById('gate-msg');
    const updated = document.getElementById('updated');
    const statsEl = document.getElementById('stats');
    const peopleEl = document.getElementById('people');
    const latestEl = document.getElementById('latest');
    const tasksSection = document.getElementById('tasks-section');
    const tasksTitle = document.getElementById('tasks-title');
    const tasksEl = document.getElementById('tasks');
    const removedSection = document.getElementById('removed-section');
    const removedEl = document.getElementById('removed');
    const personFilter = document.getElementById('filter-person');
    const statusFilter = document.getElementById('filter-status');
    const criticalFilter = document.getElementById('filter-critical');
    const overdueFilter = document.getElementById('filter-overdue');

    let data = null;
    let feedOpen = false;
    let panelSeq = 0;

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function icon(name, className) {
      const span = el('span', 'team-icon' + (className ? ' ' + className : ''));
      span.setAttribute('aria-hidden', 'true');
      span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
      return span;
    }

    function todayIST() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Kolkata',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).formatToParts(new Date());
      const get = (type) => Number(parts.find((p) => p.type === type).value);
      return Date.UTC(get('year'), get('month') - 1, get('day'));
    }

    const TODAY = todayIST();

    function parseDue(iso) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
      const [y, m, d] = iso.split('-').map(Number);
      return Date.UTC(y, m - 1, d);
    }

    function formatDue(iso) {
      const due = parseDue(iso);
      if (due == null) return iso || '';
      return new Date(due).toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'short',
        timeZone: 'UTC',
      });
    }

    function formatUpdated(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('en-IN', {
        timeZone: 'Asia/Kolkata',
        day: 'numeric',
        month: 'short',
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function isCritical(row) {
      const key = Object.keys(row).find((k) => /^critical\??$/i.test(String(k).trim()));
      return key ? String(row[key]).trim().toLowerCase() === 'yes' : false;
    }

    function taskStatus(task) {
      return STATUSES.includes(task.status) ? task.status : 'Not started';
    }

    function isOverdue(task) {
      const due = parseDue(task.Due);
      return due != null && due < TODAY && taskStatus(task) !== 'Done';
    }

    function splitNames(value) {
      return String(value || '').split(',').map((s) => s.trim()).filter(Boolean);
    }

    function statusIcon(status) {
      const name = status === 'Done' ? 'done' : status === 'In progress' ? 'progress' : 'todo';
      return icon(name, 'team-st is-' + name);
    }

    function noteThread(notes) {
      const list = el('ul', 'team-thread');
      for (const note of notes) {
        const item = el('li', 'team-thread-item');
        const when = formatUpdated(note.at);
        item.append(el('p', 'team-thread-meta', (note.by || 'Someone') + (when ? ' · ' + when : '')));
        item.append(el('p', 'team-thread-text', note.text || ''));
        list.append(item);
      }
      return list;
    }

    function showGate(message) {
      dash.hidden = true;
      tools.hidden = true;
      gate.hidden = false;
      gateMsg.textContent = message || '';
      document.title = 'Team summary';
    }

    /* ---------- Overview ---------- */

    function fillStats() {
      const tasks = data.tasks || [];
      const done = tasks.filter((t) => taskStatus(t) === 'Done').length;
      const progress = tasks.filter((t) => taskStatus(t) === 'In progress').length;
      const critical = tasks.filter((t) => isCritical(t) && taskStatus(t) !== 'Done').length;
      const overdue = tasks.filter(isOverdue).length;
      const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;

      statsEl.replaceChildren();

      const doneTile = el('div', 'admin-stat');
      const doneValue = el('span', 'admin-stat-value', String(done));
      doneValue.append(el('small', '', ' / ' + tasks.length));
      const bar = el('span', 'admin-stat-bar');
      const fill = el('span');
      fill.style.width = pct + '%';
      bar.append(fill);
      doneTile.append(doneValue, el('span', 'admin-stat-label', 'Done · ' + pct + '%'), bar);
      statsEl.append(doneTile);

      const tile = (value, label, hot, onClick, on) => {
        const node = el(onClick ? 'button' : 'div', 'admin-stat' + (hot ? ' is-hot' : '') + (on ? ' is-on' : ''));
        if (onClick) {
          node.type = 'button';
          node.setAttribute('aria-pressed', on ? 'true' : 'false');
          node.addEventListener('click', onClick);
        }
        node.append(el('span', 'admin-stat-value', String(value)), el('span', 'admin-stat-label', label));
        statsEl.append(node);
      };

      tile(progress, 'In progress', false, () => {
        statusFilter.value = statusFilter.value === 'In progress' ? '' : 'In progress';
        applyFilters(true);
      }, statusFilter.value === 'In progress');
      tile(critical, 'Critical open', critical > 0, () => {
        setToggle(criticalFilter, !isOn(criticalFilter));
        applyFilters(true);
      }, isOn(criticalFilter));
      tile(overdue, 'Overdue', overdue > 0, () => {
        setToggle(overdueFilter, !isOn(overdueFilter));
        applyFilters(true);
      }, isOn(overdueFilter));
    }

    function fillPeople() {
      peopleEl.replaceChildren();
      const rows = data.people || [];
      if (!rows.length) {
        peopleEl.append(el('li', 'team-empty', 'No one has a link yet.'));
        return;
      }
      for (const person of rows) {
        const total = person.total || 0;
        const done = person.done || 0;
        const progress = person.inProgress || 0;
        const crit = person.criticalOpen || 0;
        const li = el('li', 'admin-person');
        const button = el('button');
        button.type = 'button';
        const selected = personFilter.value && personFilter.value.toLowerCase() === String(person.name || '').toLowerCase();
        button.setAttribute('aria-pressed', selected ? 'true' : 'false');

        button.append(el('span', 'admin-person-name', person.name || ''));
        const nums = el('span', 'admin-person-nums');
        if (crit > 0) {
          const tag = el('span', 'admin-crit-tag');
          tag.append(icon('critical'), el('span', '', String(crit)));
          tag.title = crit + ' critical open';
          nums.append(tag);
        }
        nums.append(el('span', '', done + '/' + total + ' done'));
        button.append(nums);

        const bar = el('span', 'admin-bar');
        bar.setAttribute('role', 'img');
        bar.setAttribute('aria-label', done + ' done, ' + progress + ' in progress, of ' + total);
        if (total) {
          const d = el('span', 'is-done');
          d.style.width = (done / total) * 100 + '%';
          const p = el('span', 'is-progress');
          p.style.width = (progress / total) * 100 + '%';
          bar.append(d, p);
        }
        button.append(bar);

        button.addEventListener('click', () => {
          personFilter.value = selected ? '' : person.name;
          applyFilters(true);
        });
        li.append(button);
        if (person.code) {
          const link = el('a', 'admin-person-open');
          link.href = 'team.html?k=' + encodeURIComponent(person.code);
          link.target = '_blank';
          link.rel = 'noopener';
          link.title = 'Open ' + (person.name || 'their') + "'s page";
          link.setAttribute('aria-label', 'Open ' + (person.name || 'their') + "'s to-do page in a new tab");
          link.append(icon('link'));
          li.append(link);
        }
        peopleEl.append(li);
      }
    }

    function fillLatest() {
      latestEl.replaceChildren();
      const notes = data.latestNotes || [];
      if (!notes.length) {
        latestEl.append(el('p', 'team-empty', 'No notes yet.'));
        return;
      }
      const card = el('div', 'admin-card');
      const list = el('ul', 'admin-feed');
      const shown = feedOpen ? notes : notes.slice(0, FEED_LIMIT);
      for (const note of shown) {
        const item = el('li', 'admin-feed-item');
        const when = formatUpdated(note.at);
        const meta = el('p', 'admin-feed-meta');
        meta.append(el('b', '', note.by || 'Someone'));
        if (when) meta.append(' · ' + when);
        item.append(meta);
        const title = note.task
          ? (note.taskId ? note.taskId + ' · ' + note.task : note.task)
          : (note.taskId || 'Task');
        item.append(el('p', 'admin-feed-task', title));
        item.append(el('p', 'admin-feed-text', note.text || ''));
        list.append(item);
      }
      card.append(list);
      if (notes.length > FEED_LIMIT) {
        const more = el('button', 'admin-more', feedOpen ? 'Show fewer' : 'Show all ' + notes.length);
        more.type = 'button';
        more.addEventListener('click', () => {
          feedOpen = !feedOpen;
          fillLatest();
        });
        card.append(more);
      }
      latestEl.append(card);
    }

    /* ---------- Tasks ---------- */

    function isOn(button) {
      return button.getAttribute('aria-pressed') === 'true';
    }

    function setToggle(button, on) {
      button.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function personOptions() {
      const names = [];
      const seen = new Set();
      const add = (name) => {
        const trimmed = String(name || '').trim();
        const key = trimmed.toLowerCase();
        if (!trimmed || seen.has(key)) return;
        seen.add(key);
        names.push(trimmed);
      };
      for (const person of data.people || []) add(person.name);
      for (const task of data.tasks || []) {
        for (const name of splitNames(task.Person)) add(name);
      }
      const current = personFilter.value;
      personFilter.replaceChildren(el('option', '', 'Everyone'));
      personFilter.firstChild.value = '';
      for (const name of names) {
        const option = el('option', '', name);
        option.value = name;
        personFilter.append(option);
      }
      personFilter.value = [...personFilter.options].some((o) => o.value === current) ? current : '';
    }

    function matches(task) {
      if (personFilter.value) {
        const want = personFilter.value.toLowerCase();
        if (!splitNames(task.Person).some((name) => name.toLowerCase() === want)) return false;
      }
      if (statusFilter.value && taskStatus(task) !== statusFilter.value) return false;
      if (isOn(criticalFilter) && !isCritical(task)) return false;
      if (isOn(overdueFilter) && !isOverdue(task)) return false;
      return true;
    }

    function foldRow(className, head, panel) {
      const card = el('article', 'team-task' + className);
      const toggle = el('button', 'team-task-toggle');
      toggle.type = 'button';
      toggle.append(...head);
      const h = el('h3', 'team-task-h');
      h.append(toggle);
      panel.className = 'team-task-panel';
      panel.id = 'admin-panel-' + (++panelSeq);
      panel.hidden = true;
      toggle.setAttribute('aria-controls', panel.id);
      toggle.setAttribute('aria-expanded', 'false');
      toggle.addEventListener('click', () => {
        const open = panel.hidden;
        panel.hidden = !open;
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        card.classList.toggle('is-open', open);
      });
      card.append(h, panel);
      return card;
    }

    function sideBits(notes) {
      const side = el('span', 'team-task-side');
      if (notes.length) {
        const pill = el('span', 'team-note-pill');
        pill.append(icon('note'), el('span', '', String(notes.length)));
        pill.title = notes.length + (notes.length === 1 ? ' note' : ' notes');
        side.append(pill);
      }
      side.append(icon('chevron', 'team-chevron'));
      return side;
    }

    function panelBody(panel, row, notes) {
      if (row.statusAt) {
        const when = formatUpdated(row.statusAt);
        const line = el('p', 'admin-panel-line', 'Status set by ');
        line.append(el('b', '', row.statusBy || 'someone'));
        if (when) line.append(' · ' + when);
        panel.append(line);
      }
      if (notes.length) panel.append(noteThread(notes));
      else panel.append(el('p', 'admin-panel-empty', 'No notes yet.'));
    }

    function taskRow(task) {
      const status = taskStatus(task);
      const notes = Array.isArray(task.notes) ? task.notes : [];
      const critical = isCritical(task);
      const overdue = isOverdue(task);

      const main = el('span', 'team-task-main');
      const title = el('span', 'team-title');
      if (critical) {
        const flag = icon('critical', 'team-crit-icon');
        flag.setAttribute('aria-hidden', 'false');
        flag.setAttribute('role', 'img');
        flag.setAttribute('aria-label', 'Critical');
        title.append(flag);
      }
      title.append(el('span', '', task.Task || 'Task'));
      main.append(title);

      const meta = el('span', 'team-task-meta');
      if (task.Person) meta.append(el('span', 'admin-person-tag', task.Person));
      if (task.Due) {
        const due = el('span', 'team-due', overdue ? 'Overdue · ' + formatDue(task.Due) : formatDue(task.Due));
        if (overdue) due.classList.add('is-late');
        meta.append(due);
      }
      if (status === 'In progress') meta.append(el('span', 'team-state-tag', 'In progress'));
      if (task.ID) meta.append(el('span', '', task.ID));
      main.append(meta);

      const panel = el('div');
      if (task.Role) panel.append(el('p', 'admin-panel-line', 'Role: ' + task.Role));
      panelBody(panel, task, notes);

      const className = (critical ? ' is-critical' : '') + (status === 'Done' ? ' is-done' : '');
      return foldRow(className, [statusIcon(status), main, sideBits(notes)], panel);
    }

    function byUrgency(a, b) {
      const rank = (t) => (taskStatus(t) === 'Done' ? 2 : 0) - (isCritical(t) && taskStatus(t) !== 'Done' ? 1 : 0);
      const due = (t) => parseDue(t.Due) ?? Infinity;
      return rank(a) - rank(b) || due(a) - due(b);
    }

    function fillTasks() {
      const all = data.tasks || [];
      const shown = all.filter(matches).sort(byUrgency);
      tasksTitle.replaceChildren('Tasks ');
      tasksTitle.append(el('span', '', shown.length === all.length ? String(all.length) : shown.length + ' of ' + all.length));
      tasksEl.replaceChildren();
      if (!shown.length) {
        tasksEl.append(el('p', 'team-empty', 'No tasks match.'));
        return;
      }
      const card = el('div', 'team-group-list');
      for (const task of shown) card.append(taskRow(task));
      tasksEl.append(card);
    }

    function fillRemoved() {
      const rows = data.removed || [];
      removedSection.hidden = rows.length === 0;
      const summary = removedSection.querySelector('summary');
      summary.replaceChildren('Removed from the list · ' + rows.length, icon('chevron'));
      removedEl.replaceChildren();
      if (!rows.length) return;
      const card = el('div', 'team-group-list');
      for (const row of rows) {
        const notes = Array.isArray(row.notes) ? row.notes : [];
        const status = taskStatus(row);
        const main = el('span', 'team-task-main');
        main.append(el('span', 'team-title', row.taskId || 'Task'));
        main.append(el('span', 'team-task-meta', status));
        const panel = el('div');
        panelBody(panel, row, notes);
        card.append(foldRow(status === 'Done' ? ' is-done' : '', [statusIcon(status), main, sideBits(notes)], panel));
      }
      removedEl.append(card);
    }

    function syncFilterLooks() {
      personFilter.classList.toggle('is-set', !!personFilter.value);
      statusFilter.classList.toggle('is-set', !!statusFilter.value);
      const crit = (data?.tasks || []).filter((t) => isCritical(t)).length;
      criticalFilter.replaceChildren(icon('critical'), 'Critical');
      criticalFilter.append(el('span', 'team-filter-count', String(crit)));
    }

    function applyFilters(scroll) {
      syncFilterLooks();
      fillStats();
      fillPeople();
      fillTasks();
      if (scroll) tasksSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function render(payload) {
      data = payload;
      const when = formatUpdated(payload.updated);
      updated.textContent = when ? 'List updated ' + when + ' IST' : '';
      document.title = 'Team summary';
      personOptions();
      syncFilterLooks();
      fillStats();
      fillPeople();
      fillLatest();
      fillTasks();
      fillRemoved();
      gate.hidden = true;
      dash.hidden = false;
      tools.hidden = false;
    }

    /* ---------- CSV ---------- */

    function csvCell(value) {
      let text = String(value ?? '');
      if (/^[=+\-@\t]/.test(text)) text = "'" + text;
      if (/[",\r\n]/.test(text)) return '"' + text.replace(/"/g, '""') + '"';
      return text;
    }

    function joinNotes(notes) {
      return (Array.isArray(notes) ? notes : [])
        .map((note) => '[' + (note.at || '') + ' ' + (note.by || '') + '] ' + (note.text || ''))
        .join(' | ');
    }

    function downloadCsv() {
      if (!data) return;
      const headers = ['ID', 'Person', 'Role', 'Task', 'Critical', 'Due', 'Status', 'Updated by', 'Updated at', 'Notes', 'On the list'];
      const lines = [headers.map(csvCell).join(',')];
      const add = (cells) => lines.push(cells.map(csvCell).join(','));
      for (const task of data.tasks || []) {
        add([
          task.ID || '',
          task.Person || '',
          task.Role || '',
          task.Task || '',
          isCritical(task) ? 'Yes' : '',
          task.Due || '',
          taskStatus(task),
          task.statusBy || '',
          task.statusAt || '',
          joinNotes(task.notes),
          'Yes',
        ]);
      }
      for (const row of data.removed || []) {
        add([
          row.taskId || '',
          '',
          '',
          '(removed from the list)',
          '',
          '',
          taskStatus(row),
          row.statusBy || '',
          row.statusAt || '',
          joinNotes(row.notes),
          'No',
        ]);
      }
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = el('a');
      link.href = url;
      link.download = 'wedding-team-status.csv';
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    /* ---------- Auth ---------- */

    async function fetchAdmin(password) {
      let response;
      try {
        response = await fetch(WORKER_URL + '/api/admin', {
          headers: { authorization: 'Bearer ' + password },
        });
      } catch (e) {
        throw new Error("Couldn't load right now. Please try again in a minute.");
      }
      let payload = {};
      try { payload = await response.json(); } catch (e) { /* ignore */ }
      if (!response.ok) {
        const error = new Error(payload.error || "Couldn't load right now. Please try again in a minute.");
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    async function unlock(password, fromStore) {
      gateMsg.textContent = 'Checking…';
      try {
        const payload = await fetchAdmin(password);
        sessionStorage.setItem(KEY, password);
        passwordInput.value = '';
        render(payload);
        gateMsg.textContent = '';
      } catch (error) {
        sessionStorage.removeItem(KEY);
        if (!fromStore) passwordInput.value = '';
        showGate(error.message);
        if (!fromStore) passwordInput.focus();
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      unlock(passwordInput.value, false);
    });

    document.getElementById('refresh').addEventListener('click', () => {
      const saved = sessionStorage.getItem(KEY);
      if (!saved) showGate('Enter the password again.');
      else unlock(saved, true);
    });

    document.getElementById('signout').addEventListener('click', () => {
      sessionStorage.removeItem(KEY);
      passwordInput.value = '';
      data = null;
      showGate();
      passwordInput.focus();
    });

    document.getElementById('download').addEventListener('click', downloadCsv);
    personFilter.addEventListener('change', () => applyFilters(false));
    statusFilter.addEventListener('change', () => applyFilters(false));
    criticalFilter.addEventListener('click', () => {
      setToggle(criticalFilter, !isOn(criticalFilter));
      applyFilters(false);
    });
    overdueFilter.addEventListener('click', () => {
      setToggle(overdueFilter, !isOn(overdueFilter));
      applyFilters(false);
    });

    let saved = null;
    try { saved = sessionStorage.getItem(KEY); } catch (e) { /* ignore */ }
    if (saved) unlock(saved, true);
    else passwordInput.focus();
  </script>
</body>
</html>
