<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Private wedding team page for Gloria and Shannon.">
  <meta name="theme-color" content="#3d1534">
  <title>Wedding team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Jost:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/team.css?v=5">
</head>
<body>
  <header class="team-top">
    <p class="team-kicker">Gloria &amp; Shannon <span aria-hidden="true">·</span> 19 Dec 2026 <span aria-hidden="true">·</span> Morjim</p>
    <h1 id="hello" class="team-hello">Wedding team</h1>
    <p id="countdown" class="team-countdown"></p>
  </header>
  <main id="app" class="team-main">
    <p class="team-status">Loading your page…</p>
  </main>
  <script>
    const WORKER_URL = 'https://team-api.shannonpereira601.workers.dev';
    const WEDDING_DAY = Date.UTC(2026, 11, 19);

    const ROLE_KNOWN = ['Role', 'Day', 'Responsibilities', 'Contact to call'];
    const TASK_KNOWN = ['ID', 'Task', 'Due', 'Detailed notes', 'Contact to call', 'Role', 'Critical', 'Critical?'];
    const FLOW_KNOWN = ['Flow', 'Time', 'What happens', 'Lead', 'Notes'];

    const ICONS = {
      roles: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/><path d="M4 20c1.2-3.6 4.2-5.5 8-5.5s6.8 1.9 8 5.5"/>',
      tasks: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/>',
      flows: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
      critical: '<path d="M12 2.8 21.2 12 12 21.2 2.8 12Z" fill="currentColor" stroke="none"/><path d="M12 7.6v5.3" style="stroke:var(--crit-ink,#fff)" stroke-width="2.2"/><circle cx="12" cy="16.3" r="1.3" style="fill:var(--crit-ink,#fff)" stroke="none"/>',
      phone: '<path d="M5 3.5h3.2l1.6 4.3-2.1 1.3a11 11 0 0 0 5.2 5.2l1.3-2.1 4.3 1.6V17a2.5 2.5 0 0 1-2.7 2.5C9.7 19 5 14.3 4.5 6.2A2.5 2.5 0 0 1 5 3.5Z"/>',
      chevron: '<path d="m7 10 5 5 5-5"/>',
      todo: '<circle cx="12" cy="12" r="8.5"/>',
      progress: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none"/>',
      done: '<circle cx="12" cy="12" r="9.5" fill="currentColor" stroke="none"/><path d="m7.8 12.4 2.8 2.8 5.6-5.8" style="stroke:#fff" stroke-width="2.2"/>',
      note: '<path d="M5 5.5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-7.5L7 20v-3.5H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
    };

    const app = document.getElementById('app');
    const hello = document.getElementById('hello');
    const countdown = document.getElementById('countdown');
    const params = new URLSearchParams(location.search);
    const code = (params.get('k') || '').trim();

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function icon(name, className) {
      const span = el('span', 'team-icon' + (className ? ' ' + className : ''));
      span.setAttribute('aria-hidden', 'true');
      span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
      return span;
    }

    function todayIST() {
      const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Kolkata',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).formatToParts(new Date());
      const get = (type) => Number(parts.find((p) => p.type === type).value);
      return Date.UTC(get('year'), get('month') - 1, get('day'));
    }

    const TODAY = todayIST();

    function parseDue(iso) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return null;
      const [y, m, d] = iso.split('-').map(Number);
      return Date.UTC(y, m - 1, d);
    }

    function daysUntil(iso) {
      const due = parseDue(iso);
      return due == null ? null : Math.round((due - TODAY) / 86400000);
    }

    function formatDue(iso) {
      const due = parseDue(iso);
      if (due == null) return iso || '';
      return new Date(due).toLocaleDateString('en-GB', {
        weekday: 'short',
        day: 'numeric',
        month: 'short',
        timeZone: 'UTC',
      });
    }

    function relativeDue(days) {
      if (days == null) return '';
      if (days === 0) return 'Today';
      if (days === 1) return 'Tomorrow';
      if (days === -1) return 'Yesterday';
      if (days > 1 && days <= 14) return 'in ' + days + ' days';
      return '';
    }

    function formatUpdated(iso) {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString('en-IN', {
        timeZone: 'Asia/Kolkata',
        day: 'numeric',
        month: 'short',
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function setCountdown() {
      const days = Math.round((WEDDING_DAY - TODAY) / 86400000);
      if (days > 1) countdown.textContent = days + ' days to go';
      else if (days === 1) countdown.textContent = 'Tomorrow!';
      else if (days === 0) countdown.textContent = 'Today’s the day!';
      else countdown.textContent = '';
    }

    function isCritical(row) {
      const key = Object.keys(row).find((k) => /^critical\??$/i.test(k.trim()));
      return key ? String(row[key]).trim().toLowerCase() === 'yes' : false;
    }

    // Turns phone numbers inside free text into tap-to-call links.
    function withPhoneLinks(node, text) {
      const pattern = /(\+?\d[\d\s-]{7,}\d)/g;
      let last = 0;
      let match;
      while ((match = pattern.exec(text))) {
        const digits = match[0].replace(/[^\d+]/g, '');
        if (digits.replace('+', '').length < 8) continue;
        node.append(text.slice(last, match.index));
        const link = el('a', 'team-tel', match[0]);
        link.href = 'tel:' + digits;
        node.append(link);
        last = match.index + match[0].length;
      }
      node.append(text.slice(last));
      return node;
    }

    function contact(text) {
      const row = el('p', 'team-contact');
      row.append(icon('phone'));
      row.append(withPhoneLinks(el('span'), text));
      return row;
    }

    function extras(row, columns, known) {
      const skip = new Set(known.map((key) => key.toLowerCase()));
      for (const key of ['as', 'status', 'statusby', 'statusat', 'notes']) skip.add(key);
      const fields = (columns || Object.keys(row)).filter((key) => {
        return key && !skip.has(key.toLowerCase()) && row[key];
      });
      if (!fields.length) return null;
      const list = el('dl', 'team-extra');
      for (const key of fields) {
        list.append(el('dt', '', key), withPhoneLinks(el('dd'), String(row[key])));
      }
      return list;
    }

    function showMessage(text) {
      document.body.classList.remove('has-nav');
      app.replaceChildren(el('p', 'team-status', text));
      document.title = 'Wedding team';
    }

    /* ---------- Roles ---------- */

    function renderRoles(data) {
      const section = el('section', 'team-section');
      section.dataset.panel = 'roles';
      if (!data.roles?.length) {
        section.append(el('p', 'team-empty', 'No roles assigned yet.'));
        return section;
      }
      for (const role of data.roles) {
        const card = el('article', 'team-card' + (role.as === 'backup' ? ' is-backup' : ''));
        const head = el('div', 'team-card-head');
        head.append(el('h2', 'team-title', role.Role || 'Role'));
        if (role.as === 'backup') head.append(el('span', 'team-badge', 'Backup'));
        card.append(head);
        if (role.Day) card.append(el('p', 'team-meta', role.Day));
        if (role.Responsibilities) card.append(el('p', 'team-body', role.Responsibilities));
        if (role['Contact to call']) card.append(contact(role['Contact to call']));
        const more = extras(role, data.columns?.roles, ROLE_KNOWN);
        if (more) card.append(more);
        section.append(card);
      }
      return section;
    }

    /* ---------- Tasks ---------- */

    function taskGroup(days) {
      if (days == null) return 'none';
      if (days < 0) return 'past';
      if (days <= 7) return 'week';
      return 'later';
    }

    const GROUPS = [
      ['past', 'Earlier'],
      ['week', 'This week'],
      ['later', 'Coming up'],
      ['none', 'No date'],
    ];

    const STATUSES = ['Not started', 'In progress', 'Done'];
    const inflight = new Set();

    function taskStatus(task) {
      return STATUSES.includes(task.status) ? task.status : 'Not started';
    }

    function applyProgress(task, payload) {
      task.status = taskStatus(payload);
      task.statusBy = payload.statusBy || null;
      task.statusAt = payload.statusAt || null;
      task.notes = Array.isArray(payload.notes) ? payload.notes : [];
    }

    async function postUpdate(fields) {
      let response;
      try {
        response = await fetch(WORKER_URL + '/api/status', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ k: code, ...fields }),
        });
      } catch (e) {
        throw new Error("Couldn't save. Please try again.");
      }
      let payload = {};
      try { payload = await response.json(); } catch (e) { /* ignore */ }
      if (!response.ok) throw new Error(payload.error || "Couldn't save. Please try again.");
      return payload;
    }

    function fillThread(list, notes) {
      list.replaceChildren();
      const rows = Array.isArray(notes) ? notes : [];
      list.hidden = rows.length === 0;
      for (const note of rows) {
        const item = el('li', 'team-thread-item');
        const when = formatUpdated(note.at);
        item.append(el('p', 'team-thread-meta', (note.by || 'Someone') + (when ? ' · ' + when : '')));
        item.append(el('p', 'team-thread-text', note.text || ''));
        list.append(item);
      }
    }

    function statusIcon(status) {
      const name = status === 'Done' ? 'done' : status === 'In progress' ? 'progress' : 'todo';
      return icon(name, 'team-st is-' + name);
    }

    // The part that opens under a task: status, details, notes.
    function taskPanel(task, state, redraw) {
      const panel = el('div', 'team-task-panel');
      const msg = el('p', 'team-save-msg' + (state.flash && !state.flash.ok ? ' is-error' : ''));
      msg.setAttribute('aria-live', 'polite');
      if (state.flash) msg.textContent = state.flash.text;

      function lock(on) {
        panel.setAttribute('aria-busy', on ? 'true' : 'false');
        panel.querySelectorAll('button, textarea').forEach((node) => { node.disabled = on; });
      }

      function fail(text) {
        msg.classList.add('is-error');
        msg.textContent = text;
      }

      async function send(fields, onSaved) {
        if (inflight.has(task.ID)) return false;
        inflight.add(task.ID);
        msg.classList.remove('is-error');
        msg.textContent = 'Saving…';
        lock(true);
        try {
          const payload = await postUpdate({ taskId: task.ID, ...fields });
          applyProgress(task, payload);
          if (onSaved) onSaved();
          redraw({ id: task.ID, text: 'Saved ✓', ok: true });
          return true;
        } catch (error) {
          lock(false);
          fail(error.message);
          return false;
        } finally {
          inflight.delete(task.ID);
        }
      }

      if (task.ID) {
        const seg = el('div', 'team-seg');
        seg.setAttribute('role', 'group');
        seg.setAttribute('aria-label', 'Status');
        const buttons = [];
        const press = (label) => buttons.forEach((b) => {
          b.setAttribute('aria-pressed', b.dataset.status === label ? 'true' : 'false');
        });
        for (const label of STATUSES) {
          const button = el('button');
          button.type = 'button';
          button.dataset.status = label;
          button.append(statusIcon(label), el('span', '', label));
          button.setAttribute('aria-pressed', label === taskStatus(task) ? 'true' : 'false');
          button.addEventListener('click', async () => {
            if (label === taskStatus(task) && task.statusAt) return;
            press(label);
            if (!(await send({ status: label }))) press(taskStatus(task));
          });
          buttons.push(button);
          seg.append(button);
        }
        panel.append(seg);
        if (task.statusAt) {
          const when = formatUpdated(task.statusAt);
          panel.append(el('p', 'team-status-meta', 'Updated by ' + (task.statusBy || 'someone') + (when ? ' · ' + when : '')));
        }
      }

      const plan = task['Detailed notes'];
      const phone = task['Contact to call'];
      const more = extras(task, state.columns, TASK_KNOWN);
      if (plan || phone || more) {
        const details = el('div', 'team-task-details');
        if (plan) details.append(withPhoneLinks(el('p', 'team-body'), plan));
        if (phone) details.append(contact(phone));
        if (more) details.append(more);
        panel.append(details);
      }

      if (task.ID) {
        const block = el('div', 'team-notes-block');
        const thread = el('ul', 'team-thread');
        fillThread(thread, task.notes);

        const add = el('button', 'team-add-note');
        add.type = 'button';
        add.append(icon('plus'), el('span', '', 'Add a note'));

        const form = el('div', 'team-note-form');
        const area = el('textarea', 'team-note-input');
        area.maxLength = 500;
        area.rows = 3;
        area.placeholder = 'e.g. Called the florist, waiting to hear back';
        area.setAttribute('aria-label', 'Note');
        area.value = state.draft || '';
        const counter = el('span', 'team-note-count');
        const count = () => {
          counter.textContent = area.value.length > 400 ? area.value.length + ' / 500' : '';
        };
        count();
        area.addEventListener('input', count);
        const cancel = el('button', 'team-cancel', 'Cancel');
        cancel.type = 'button';
        const save = el('button', 'team-save', 'Save');
        save.type = 'button';
        const row = el('div', 'team-note-row');
        row.append(counter, cancel, save);
        form.append(area, row);

        const composing = !!(state.composing || state.draft);
        form.hidden = !composing;
        add.hidden = composing;

        add.addEventListener('click', () => {
          form.hidden = false;
          add.hidden = true;
          msg.textContent = '';
          area.focus();
        });
        cancel.addEventListener('click', () => {
          area.value = '';
          count();
          form.hidden = true;
          add.hidden = false;
          msg.textContent = '';
          add.focus();
        });
        save.addEventListener('click', () => {
          const text = area.value.trim();
          if (!text) {
            fail('Write a note first.');
            area.focus();
            return;
          }
          send({ note: text }, () => {
            area.value = '';
            form.hidden = true;
          });
        });

        block.append(thread, add, form);
        panel.append(block);
      }

      panel.append(msg);
      return panel;
    }

    let panelSeq = 0;

    function taskCard(task, data, state, redraw) {
      const days = daysUntil(task.Due);
      const critical = isCritical(task);
      const status = taskStatus(task);
      const notes = Array.isArray(task.notes) ? task.notes : [];
      const hasPanel = !!(task.ID || task['Detailed notes'] || task['Contact to call'] || extras(task, data.columns?.tasks, TASK_KNOWN));

      const card = el('article', 'team-task');
      if (task.ID) card.dataset.id = task.ID;
      if (critical) card.classList.add('is-critical');
      if (status === 'Done') card.classList.add('is-done');

      const toggle = el(hasPanel ? 'button' : 'div', 'team-task-toggle');
      toggle.append(statusIcon(status));

      const main = el('span', 'team-task-main');
      const title = el('span', 'team-title');
      if (critical) {
        const flag = icon('critical', 'team-crit-icon');
        flag.setAttribute('aria-hidden', 'false');
        flag.setAttribute('role', 'img');
        flag.setAttribute('aria-label', 'Critical');
        title.append(flag);
      }
      title.append(el('span', '', task.Task || 'Task'));
      main.append(title);

      const meta = el('span', 'team-task-meta');
      if (status === 'In progress') meta.append(el('span', 'team-state-tag', 'In progress'));
      if (task.Due) {
        const rel = relativeDue(days);
        const due = el('span', 'team-due', rel ? rel.replace(/^in /, 'In ') : formatDue(task.Due));
        due.title = formatDue(task.Due);
        if (status !== 'Done' && days != null) {
          if (days < 0) {
            due.classList.add('is-late');
            due.textContent = 'Overdue · ' + formatDue(task.Due);
          } else if (days <= 2) {
            due.classList.add('is-soon');
          }
        }
        meta.append(due);
      }
      if (task.Role) meta.append(el('span', 'team-role', task.Role));
      if (task.as === 'backup') meta.append(el('span', 'team-badge', 'Backup'));
      if (meta.childNodes.length) main.append(meta);

      const side = el('span', 'team-task-side');
      if (notes.length) {
        const pill = el('span', 'team-note-pill');
        pill.append(icon('note'), el('span', '', String(notes.length)));
        pill.title = notes.length + (notes.length === 1 ? ' note' : ' notes');
        side.append(pill);
      }
      if (hasPanel) side.append(icon('chevron', 'team-chevron'));
      toggle.append(main, side);

      const heading = el('h3', 'team-task-h');
      heading.append(toggle);
      card.append(heading);

      if (hasPanel) {
        const panel = taskPanel(task, { ...state, columns: data.columns?.tasks }, redraw);
        panel.id = 'task-panel-' + (++panelSeq);
        toggle.type = 'button';
        toggle.setAttribute('aria-controls', panel.id);
        const setOpen = (open) => {
          panel.hidden = !open;
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
          card.classList.toggle('is-open', open);
        };
        setOpen(!!state.open);
        toggle.addEventListener('click', () => setOpen(panel.hidden));
        card.append(panel);
      }
      return card;
    }

    function renderTasks(data) {
      const section = el('section', 'team-section');
      section.dataset.panel = 'tasks';
      const tasks = (data.tasks || []).map((task, index) => ({
        task,
        index,
        days: daysUntil(task.Due),
        critical: isCritical(task),
      }));
      if (!tasks.length) {
        section.append(el('p', 'team-empty', 'No tasks assigned yet.'));
        return section;
      }

      const counts = { all: 0, critical: 0, week: 0, backup: 0 };
      function recount() {
        counts.all = tasks.length;
        counts.critical = tasks.filter((t) => t.critical && taskStatus(t.task) !== 'Done').length;
        counts.week = tasks.filter((t) => taskGroup(t.days) === 'week' && taskStatus(t.task) !== 'Done').length;
        counts.backup = tasks.filter((t) => t.task.as === 'backup').length;
      }
      recount();
      const filters = [
        ['all', 'All', null],
        ['critical', 'Critical', 'critical'],
        ['week', 'This week', null],
      ];
      if (counts.backup && counts.backup < counts.all) filters.push(['backup', 'Backup', null]);

      const bar = el('div', 'team-filters');
      bar.setAttribute('role', 'group');
      bar.setAttribute('aria-label', 'Filter tasks');
      const list = el('div', 'team-task-list');

      const matches = {
        all: () => true,
        critical: (t) => t.critical && taskStatus(t.task) !== 'Done',
        week: (t) => taskGroup(t.days) === 'week' && taskStatus(t.task) !== 'Done',
        backup: (t) => t.task.as === 'backup',
      };
      const emptyText = {
        critical: 'No critical tasks still open.',
        week: 'Nothing due in the next 7 days.',
        backup: 'No backup tasks.',
      };
      const byDue = (a, b) => (a.days ?? 1e9) - (b.days ?? 1e9) || b.critical - a.critical || a.index - b.index;

      function publishCritical(n) {
        document.querySelector('.team-nav [data-tab="tasks"] .team-icon')?.classList.toggle('has-critical', n > 0);
        const button = document.querySelector('.team-alert');
        if (!button) return;
        const label = button.querySelector('.team-alert-label');
        if (label) {
          label.textContent = (n === 1 ? '1 critical task' : n + ' critical tasks') + ' — tap to view';
        }
        button.dataset.count = String(n);
        const onTasks = document.querySelector('.team-nav button[aria-current="page"]')?.dataset.tab === 'tasks';
        button.hidden = n <= 0 || onTasks;
      }

      function draw(filter) {
        const flash = draw.flash || null;
        draw.flash = null;
        const opened = new Set(
          [...list.querySelectorAll('.team-task.is-open[data-id]')].map((node) => node.dataset.id),
        );
        const drafts = new Map();
        const composing = new Set();
        for (const card of list.querySelectorAll('[data-id]')) {
          const form = card.querySelector('.team-note-form');
          if (!form || form.hidden) continue;
          composing.add(card.dataset.id);
          const value = form.querySelector('textarea')?.value || '';
          if (value) drafts.set(card.dataset.id, value);
        }
        const y = window.scrollY;
        recount();
        bar.querySelectorAll('button').forEach((b) => {
          const on = b.dataset.filter === filter;
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
          const count = b.querySelector('.team-filter-count');
          if (count) count.textContent = String(counts[b.dataset.filter]);
          if (b.dataset.filter === 'critical') b.disabled = counts.critical === 0 && !on;
        });
        const shown = tasks.filter(matches[filter]);
        list.replaceChildren();
        const redraw = (next) => {
          draw.flash = next;
          draw(filter);
        };
        const addCard = (group, item) => {
          const id = item.task.ID;
          const card = taskCard(item.task, data, {
            open: opened.has(id),
            flash: flash && flash.id === id ? flash : null,
            draft: drafts.get(id) || '',
            composing: composing.has(id),
          }, redraw);
          group.append(card);
        };
        const addGroup = (className, label, items) => {
          const group = el('div', 'team-group' + className);
          const head = el('h2', 'team-group-head', label);
          head.append(el('span', '', String(items.length)));
          const box = el('div', 'team-group-list');
          for (const t of items) addCard(box, t);
          group.append(head, box);
          list.append(group);
        };
        if (!shown.length) {
          list.append(el('p', 'team-empty', emptyText[filter] || 'No tasks.'));
        } else {
          const openItems = shown.filter((t) => taskStatus(t.task) !== 'Done');
          for (const [id, label] of GROUPS) {
            const items = openItems.filter((t) => taskGroup(t.days) === id).sort(byDue);
            if (items.length) addGroup(id === 'past' ? ' is-past' : '', label, items);
          }
          const doneItems = shown.filter((t) => taskStatus(t.task) === 'Done').sort(byDue);
          if (doneItems.length) addGroup(' is-done-group', 'Done', doneItems);
        }
        publishCritical(counts.critical);
        window.scrollTo(0, y);
        if (flash?.id) {
          list.querySelector('[data-id="' + CSS.escape(flash.id) + '"]')?.scrollIntoView({ block: 'nearest' });
        }
      }

      for (const [id, label, iconName] of filters) {
        const button = el('button', 'team-filter' + (id === 'critical' ? ' is-critical' : ''));
        button.type = 'button';
        button.dataset.filter = id;
        if (iconName) button.append(icon(iconName));
        button.append(label);
        button.append(el('span', 'team-filter-count', String(counts[id])));
        if (id === 'critical' && !counts.critical) button.disabled = true;
        button.addEventListener('click', () => draw(id));
        bar.append(button);
      }

      section.append(bar, list);
      section.showFilter = draw;
      draw('all');
      return section;
    }

    /* ---------- Flows ---------- */

    function renderFlows(data) {
      const section = el('section', 'team-section');
      section.dataset.panel = 'flows';
      const flowNames = Object.keys(data.flows || {});
      if (!flowNames.length) {
        section.append(el('p', 'team-empty', 'No day flows for your roles yet.'));
        return section;
      }
      const chips = el('div', 'team-filters');
      chips.setAttribute('role', 'group');
      chips.setAttribute('aria-label', 'Choose a flow');
      const decks = el('div', 'team-decks');
      const me = (data.name || '').toLowerCase();

      flowNames.forEach((name, index) => {
        const chip = el('button', 'team-filter', name);
        chip.type = 'button';
        chip.setAttribute('aria-pressed', index === 0 ? 'true' : 'false');
        const deck = el('ol', 'team-timeline');
        deck.hidden = index !== 0;
        const rows = data.flows[name] || [];
        if (!rows.length) {
          deck.append(el('li', 'team-empty', 'No lines in this flow yet.'));
        }
        for (const row of rows) {
          const line = el('li', 'team-line');
          const lead = row.Lead || '';
          if (me && lead.toLowerCase().includes(me)) line.classList.add('is-mine');
          line.append(el('span', 'team-time', row.Time || ''));
          const body = el('div', 'team-line-body');
          body.append(el('p', 'team-what', row['What happens'] || ''));
          if (lead) {
            const leadRow = el('p', 'team-lead', lead);
            if (line.classList.contains('is-mine')) leadRow.append(el('span', 'team-you', 'You'));
            body.append(leadRow);
          }
          if (row.Notes) body.append(withPhoneLinks(el('p', 'team-notes'), row.Notes));
          const more = extras(row, data.columns?.flows, FLOW_KNOWN);
          if (more) body.append(more);
          line.append(body);
          deck.append(line);
        }
        chip.addEventListener('click', () => {
          chips.querySelectorAll('button').forEach((b) => {
            b.setAttribute('aria-pressed', b === chip ? 'true' : 'false');
          });
          decks.querySelectorAll('.team-timeline').forEach((panel) => {
            panel.hidden = panel !== deck;
          });
        });
        chips.append(chip);
        decks.append(deck);
      });
      section.append(chips, decks);
      return section;
    }

    /* ---------- Page ---------- */

    function render(data) {
      document.title = data.name + ' · Wedding team';
      document.body.classList.add('has-nav');
      hello.textContent = 'Hi ' + data.name;

      const root = el('div', 'team-page');
      const roles = renderRoles(data);
      const tasks = renderTasks(data);
      const flows = renderFlows(data);
      const panels = { roles, tasks, flows };

      const anyCritical = (data.tasks || []).some(isCritical);
      const critical = (data.tasks || []).filter(
        (t) => isCritical(t) && (t.status || 'Not started') !== 'Done',
      );
      let alert = null;
      if (anyCritical) {
        alert = el('button', 'team-alert');
        alert.type = 'button';
        alert.dataset.count = String(critical.length);
        if (!critical.length) alert.hidden = true;
        alert.append(icon('critical'));
        const label = critical.length === 1 ? '1 critical task' : critical.length + ' critical tasks';
        alert.append(el('span', 'team-alert-label', label + ' — tap to view'));
        alert.addEventListener('click', () => {
          show('tasks');
          tasks.showFilter?.('critical');
        });
        root.append(alert);
      }

      root.append(roles, tasks, flows);

      const when = formatUpdated(data.updated);
      if (when) root.append(el('p', 'team-updated', 'Updated ' + when + ' IST'));

      const nav = el('nav', 'team-nav');
      nav.setAttribute('aria-label', 'Sections');
      const tabs = [
        ['roles', 'Roles', (data.roles || []).length],
        ['tasks', 'Tasks', (data.tasks || []).length],
        ['flows', 'Flows', Object.keys(data.flows || {}).length],
      ];
      for (const [id, label, count] of tabs) {
        const button = el('button');
        button.type = 'button';
        button.dataset.tab = id;
        const glyph = icon(id);
        if (count) glyph.append(el('span', 'team-count', String(count)));
        if (id === 'tasks' && critical.length) glyph.classList.add('has-critical');
        button.append(glyph, el('span', 'team-nav-label', label));
        button.addEventListener('click', () => show(id));
        nav.append(button);
      }
      root.append(nav);

      function show(name, keepScroll) {
        for (const [id, panel] of Object.entries(panels)) panel.hidden = id !== name;
        if (alert) {
          const n = Number(alert.dataset.count || '0');
          alert.hidden = name === 'tasks' || n <= 0;
        }
        nav.querySelectorAll('button').forEach((b) => {
          if (b.dataset.tab === name) b.setAttribute('aria-current', 'page');
          else b.removeAttribute('aria-current');
        });
        try { history.replaceState(null, '', '#' + name); } catch (e) { /* ignore */ }
        if (!keepScroll) window.scrollTo(0, 0);
      }

      app.replaceChildren(root);
      const start = location.hash.slice(1);
      show(panels[start] ? start : 'roles', true);
    }

    async function load() {
      setCountdown();
      if (!code) {
        showMessage("This link isn't recognised. Please check with Shannon or Gloria.");
        return;
      }
      try {
        const response = await fetch(WORKER_URL + '/api/team?k=' + encodeURIComponent(code));
        if (response.status === 404) {
          showMessage("This link isn't recognised. Please check with Shannon or Gloria.");
          return;
        }
        if (!response.ok) {
          showMessage("Couldn't load right now. Please try again in a minute.");
          return;
        }
        render(await response.json());
      } catch (error) {
        showMessage("Couldn't load right now. Please try again in a minute.");
      }
    }

    load();
  </script>
</body>
</html>
